spring:
    application:
        name: voyageaider

    servlet:
        multipart:
            max-file-size: 10MB
            max-request-size: 20MB

    data:
        redis:
            host: ${REDIS_HOST}
            port: ${REDIS_PORT}
    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
        hibernate:
            ddl-auto: create # create or update
        show-sql: true
        properties:
            hibernate:
                format_sql: true
                dialect: org.hibernate.dialect.MySQL8Dialect
    security:
        oauth2:
            client:
                registration:
                    google:
                        client-id: ${GOOGLE_CLIENT_ID}
                        client-secret: ${GOOGLE_CLIENT_SECRET}
                        authorization-grant-type: authorization_code
                        redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
                        scope:
                            - profile
                            - email
                        client-name: Google
    ai:
        openai:
            api-key: ${OPENAI_API_KEY}
            chat:
                options:
                    model: gpt-4o-mini
                    temperature: 0.7
                    max-tokens: 1024
    thymeleaf:
        cache: false
jwt:
    secret: ${JWT_SECRET}
    access-token-validity-in-seconds: ${JWT_ACCESS_VALIDITY}
    refresh-token-validity-in-seconds: ${JWT_REFRESH_VALIDITY}
springdoc:
    swagger-ui:
        persistAuthorization: false
        path: /swagger-ui.html
    api-docs:
        path: /v3/api-docs
cloud:
    aws:
        credentials:
            access-key: ${AWS_ACCESS_KEY_ID}
            secret-key: ${AWS_SECRET_ACCESS_KEY}
        s3:
            bucket: ${AWS_S3_BUCKET}
        region:
            static: ap-northeast-2
        stack:
            auto: false

app:
    oauth2:
        # 로컬 테스트할 땐 이거 (html 파일)
        redirect-uri: /auth/callback.html

        # 나중에 리액트(Next.js)랑 붙일 땐 이걸로 주석 해제해서 사용!
        # redirect-uri: http://localhost:3000/auth/callback
logging:
    level:
        root: info
        org.hibernate.SQL: debug
        org.springframework.ai: debug
        org.springframework.security: DEBUG